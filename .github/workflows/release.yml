name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version 'v$VERSION'" >&2
            exit 1
          fi
      # Staged publishing over OIDC needs npm >= 11.15.0 (and Node >= 22.14); pin the CLI for reproducible releases.
      - name: Install npm 11.21.2
        run: npm install -g npm@11.21.2
      - name: Require npm >= 11.15.0 (staged publishing)
        run: |
          NPM_VERSION=$(npm --version)
          if [ "$(printf '%s\n' 11.15.0 "$NPM_VERSION" | sort -V | head -n1)" != "11.15.0" ]; then
            echo "npm $NPM_VERSION is too old: staged publishing needs npm >= 11.15.0" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The trusted publisher on npmjs.com allows only `npm stage publish`: the package is staged here and
      # goes live only after a maintainer approves it on npmjs.com (Staged Packages) with 2FA.
      - name: Stage the package with provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG_ARGS="--tag next" ;;
            *) TAG_ARGS="" ;;
          esac
          npm stage publish --provenance --access public $TAG_ARGS
          {
            echo "### @netgsm/sms@$VERSION staged"
            echo ""
            echo "Approve it on npmjs.com: package @netgsm/sms → Staged Packages → Approve (2FA)."
          } >> "$GITHUB_STEP_SUMMARY"
